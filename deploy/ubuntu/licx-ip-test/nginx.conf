worker_processes 1;
pid /home/licx/campusbazaar/nginx/nginx.pid;
error_log /home/licx/campusbazaar/nginx/logs/error.log warn;
events { worker_connections 512; }
http {
  # Only the local HTTPS proxy can forward its transport protocol.
  map "$realip_remote_addr:$http_x_forwarded_proto" $cb_forwarded_proto {
    default $scheme;
    "127.0.0.1:https" https;
  }
  include /home/licx/campusbazaar/runtime/nginx/etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /home/licx/campusbazaar/nginx/tmp/licx-client;
  proxy_temp_path /home/licx/campusbazaar/nginx/tmp/licx-proxy;
  fastcgi_temp_path /home/licx/campusbazaar/nginx/tmp/fastcgi;
  uwsgi_temp_path /home/licx/campusbazaar/nginx/tmp/uwsgi;
  scgi_temp_path /home/licx/campusbazaar/nginx/tmp/scgi;

  limit_req_zone $binary_remote_addr zone=cb_api_rate:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=cb_login_rate:10m rate=10r/m;
  limit_req_zone $server_name zone=cb_ai_rate:10m rate=20r/m;
  limit_conn_zone $server_name zone=cb_ai_concurrency:10m;

  # Do not log signed image query parameters, credentials, or bearer tokens.
  log_format cb_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

  server {
    listen 18080;
    server_name 101.35.53.59 api.campusbazaar.cn;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    # All source IPs may connect; business endpoints require a valid account session.
    server_tokens off;

    access_log /home/licx/campusbazaar/nginx/logs/access.log cb_access;
    error_log /home/licx/campusbazaar/nginx/logs/error.log warn;

    client_max_body_size 6m;
    client_body_timeout 30s;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $cb_forwarded_proto;
    proxy_set_header X-User-Id "";
    proxy_set_header X-School-Id "";
    proxy_set_header X-Agent-Service-Token "";
    limit_req_status 429;
    limit_conn_status 429;

    location ^~ /internal/ {
      return 404;
    }

    location = /api/v1/auth/local/sessions {
      return 404;
    }

    location = /api/v1/auth/email-verifications {
      limit_req zone=cb_login_rate burst=10 nodelay;
      proxy_pass http://127.0.0.1:18081;
    }

    location = /api/v1/auth/password/sessions {
      limit_req zone=cb_login_rate burst=10 nodelay;
      proxy_pass http://127.0.0.1:18081;
    }

    location = /api/agent/chat {
      limit_req zone=cb_ai_rate burst=4 nodelay;
      limit_conn cb_ai_concurrency 4;
      proxy_pass http://127.0.0.1:18081;
    }

    location / {
      limit_req zone=cb_api_rate burst=50 nodelay;
      proxy_pass http://127.0.0.1:18081;
    }
  }
}
