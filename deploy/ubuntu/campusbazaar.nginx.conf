# Install in /etc/nginx/sites-available/campusbazaar; included within http {}.
# Replace YOUR_PUBLIC_IPV4 before enabling. Restrict source IPs in the cloud firewall.
limit_req_zone $binary_remote_addr zone=cb_api_rate:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cb_login_rate:10m rate=10r/m;
limit_req_zone $server_name zone=cb_ai_rate:10m rate=20r/m;
limit_conn_zone $server_name zone=cb_ai_concurrency:10m;

# Signed image URL query parameters are intentionally omitted from access logs.
log_format cb_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name YOUR_PUBLIC_IPV4;
    server_tokens off;

    access_log /var/log/nginx/campusbazaar.access.log cb_access;
    error_log /var/log/nginx/campusbazaar.error.log warn;

    client_max_body_size 6m;
    client_body_timeout 30s;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # App clients have no reason to supply service-to-service identity headers.
    proxy_set_header X-User-Id "";
    proxy_set_header X-School-Id "";
    proxy_set_header X-Agent-Service-Token "";
    limit_req_status 429;
    limit_conn_status 429;

    location ^~ /internal/ {
        return 404;
    }

    location = /api/v1/auth/local/sessions {
        return 404;
    }

    location = /api/v1/auth/email-verifications {
        limit_req zone=cb_login_rate burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v1/auth/password/sessions {
        limit_req zone=cb_login_rate burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/agent/chat {
        limit_req zone=cb_ai_rate burst=4 nodelay;
        limit_conn cb_ai_concurrency 4;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=cb_api_rate burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
